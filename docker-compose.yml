services:
  app:
    image: skayfox/exemple
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/app
    command: make test
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example"]
      interval: 5s
      timeout: 5s
      retries: 5
